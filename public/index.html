<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi.riteshgharat.me</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111111;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 1.25rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(255, 255, 255, 0.03);
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      color: #a3a3a3;
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .back-link:hover {
      background-color: rgba(255, 255, 255, 0.07);
      color: #f5f5f5;
    }
    .back-link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 0 1.5rem 6rem;
    }
    .command-card {
      display: flex;
      width: 100%;
      max-width: 320px;
      align-items: center;
      gap: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: #171717;
      padding: 1rem 1.25rem;
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.03);
    }
    code {
      flex: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 15px;
      letter-spacing: -0.025em;
      color: #f5f5f5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: all;
    }
    .copy-btn {
      flex-shrink: 0;
      border-radius: 0.375rem;
      padding: 0.25rem;
      color: #737373;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }
    .copy-btn:hover {
      color: #e5e5e5;
    }
    .copy-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
    }
    .hint-text {
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      color: #737373;
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      color: #f5f5f5;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <a href="https://riteshgharat.me" class="back-link" title="Press Esc to return">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5" />
        <path d="m11 18-6-6 6-6" />
      </svg>
      riteshgharat.me
    </a>
  </header>

  <main>
    <div class="command-card">
      <code id="cmd">ssh hi.riteshgharat.me</code>
      <button type="button" id="copy-btn" class="copy-btn" aria-label="Copy SSH command" title="Copy command">
        <svg id="copy-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="11" rx="2" />
          <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3" />
        </svg>
        <svg id="check-icon" style="display: none;" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </button>
    </div>

    <p class="hint-text">
      This site is a terminal interface.<br />
      Connect via SSH to explore.
    </p>
  </main>

  <div id="toast" class="toast">Copied to clipboard</div>

  <script>
    const COMMAND = "ssh hi.riteshgharat.me";
    const copyBtn = document.getElementById("copy-btn");
    const copyIcon = document.getElementById("copy-icon");
    const checkIcon = document.getElementById("check-icon");
    const toast = document.getElementById("toast");

    let timer;

    async function copy() {
      try {
        await navigator.clipboard.writeText(COMMAND);
        copyIcon.style.display = "none";
        checkIcon.style.display = "block";
        toast.classList.add("show");
        clearTimeout(timer);
        timer = setTimeout(() => {
          copyIcon.style.display = "block";
          checkIcon.style.display = "none";
          toast.classList.remove("show");
        }, 1600);
      } catch (err) {
        console.error("Clipboard copy failed", err);
      }
    }

    copyBtn.addEventListener("click", copy);

    // Escape key navigates to riteshgharat.me
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        window.location.href = "https://riteshgharat.me";
      }
    });
  </script>
</body>
</html>
